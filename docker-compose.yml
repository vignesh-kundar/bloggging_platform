version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: spring-blog-db
    networks:
      - spring-blog-network
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL" , "pg_isready -U bloguser -d springblog"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring-blog:
    build: .
    container_name: spring-blog-app
    networks:
      - spring-blog-network
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./config/application.properties:/app/config/application.properties
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

networks:
  spring-blog-network:
    driver: bridge

volumes:
  postgres_data:
  spring_logs: